# ==========================
# Starship Configuration
# Clean • Fast • Developer
# ==========================

add_newline = false
command_timeout = 100
scan_timeout = 30

format = """
$kubernetes\
$directory\
$git_branch\
$git_status\
$python\
$terraform\
$docker_context\
$cmd_duration\
$line_break\
$character
"""

# -------------------------
# Prompt
# -------------------------

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold yellow) "

# -------------------------
# Directory
# -------------------------

[directory]
style = "bold cyan"
format = "[$path]($style) "
home_symbol = "~"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

# -------------------------
# Git Branch
# -------------------------

[git_branch]
symbol = " "
style = "bold green"
format = "on [$symbol$branch]($style) "

# -------------------------
# Git Status
# -------------------------

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"

conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
up_to_date = ""
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# -------------------------
# Python
# -------------------------

[python]
symbol = " "
style = "yellow"
pyenv_version_name = true
detect_extensions = ["py"]
detect_files = [
  "pyproject.toml",
  "requirements.txt",
  "Pipfile",
  "poetry.lock",
  ".python-version"
]
format = "via [$symbol$virtualenv]($style)"

# -------------------------
# Terraform
# -------------------------

[terraform]
symbol = "󱁢 "
style = "bold blue"
format = " via [$symbol$workspace]($style)"

# -------------------------
# Docker
# -------------------------

[docker_context]
symbol = " "
style = "blue"
format = " via [$symbol$context]($style)"
only_with_files = true

# -------------------------
# Kubernetes
# -------------------------

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold purple"
format = "[$symbol$context( ($namespace))]($style) "

# -------------------------
# Command Duration
# -------------------------

[cmd_duration]
min_time = 1500
style = "dimmed white"
format = "[took $duration]($style) "

# -------------------------
# Disable unused modules
# -------------------------

[package]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[php]
disabled = true

[ruby]
disabled = true

[dotnet]
disabled = true

[c]
disabled = true

[cmake]
disabled = true

[swift]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[os]
disabled = true

[memory_usage]
disabled = true

[battery]
disabled = true

[shell]
disabled = true

